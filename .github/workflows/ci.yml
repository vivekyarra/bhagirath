name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bhagirath_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      BHAGIRATH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bhagirath_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test (race, coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -t bhagirath:ci .
      - name: smoke test
        run: |
          docker network create bh
          docker run -d --name db --network bh -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=bhagirath postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker run -d --name app --network bh -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:pw@db:5432/bhagirath?sslmode=disable bhagirath:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
