# Fly.io alternative: fly launch --no-deploy, then
#   fly postgres create && fly postgres attach <db-app>
#   fly secrets set BHAGIRATH_SECRET_KEY=$(openssl rand -base64 48) BHAGIRATH_BASE_URL=https://<app>.fly.dev
#   fly deploy
app = "bhagirath"
primary_region = "bom"

[build]

[env]
  BHAGIRATH_MODE = "demo"
  BHAGIRATH_ADDR = ":8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # keep timers and callbacks running
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
