{{define "content"}}
<div class="card" style="max-width:420px;margin:24px auto">
  <h1>Log in</h1>
  {{if .Data.Error}}<div class="flash err">{{.Data.Error}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{.Data.CSRF}}"><input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field"><label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary block">Log in</button>
  </form>
  {{if .Demo}}<p class="note" style="margin-top:12px">Judges: the demo account details are in the hackathon submission and the README. The demo contains only fictional data.</p>{{end}}
</div>
{{end}}
