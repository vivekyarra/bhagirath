# Render Blueprint: one Docker web service + one managed Postgres.
# Deploy: Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: bhagirath
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhagirath-db
          property: connectionString
      - key: BHAGIRATH_MODE
        value: demo
      - key: BHAGIRATH_SECRET_KEY
        generateValue: true
      - key: BHAGIRATH_BASE_URL
        sync: false          # set to the service URL, e.g. https://bhagirath.onrender.com
      - key: BHAGIRATH_JUDGE_PASSWORD
        sync: false
      - key: BHAGIRATH_ADMIN_PASSWORD
        sync: false
databases:
  - name: bhagirath-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
